[project]
name = "scfitpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-image>=0.25.0",
]

[dependency-groups]
dev = [
    "h5py",
    "ipython>=8.31.0",
    "jupyter>=1.1.1",
    "pytest>=8.3.4",
    "ruff>=0.9.2",
    "tqdm",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

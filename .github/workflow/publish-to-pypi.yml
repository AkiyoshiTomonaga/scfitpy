name: Publish Python Package

on:
  push:
    branches:
      - publish
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sourcesage
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install uv  # uvをインストール

      - name: Build package with uv
        run: |
          uv build  # uvを使ってパッケージをビルド

      - name: Publish package using uv
        run: |
          uv publish --repository pypi dist/*  # uv publishでPyPIに公開
